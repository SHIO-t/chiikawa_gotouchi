<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>ちいかわ ご当地キーホルダー 所持チェック（家族共有・Googleログイン）</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root{--bg:#0f172a;--panel:#111827;--muted:#94a3b8;--text:#e5e7eb;--accent:#22d3ee;--accent2:#a78bfa;--ok:#34d399}
    body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Noto Sans JP,Meiryo,sans-serif;background:#0b1225;color:var(--text)}
    header{position:sticky;top:0;background:#0f172a;z-index:10;border-bottom:1px solid #1f2937}
    .wrap{max-width:1100px;margin:auto;padding:12px}
    h1{margin:0 0 8px}
    input,select,button,textarea{margin:4px;padding:8px;border-radius:8px;border:1px solid #2b3a5d;background:#0b1327;color:var(--text)}
    button{cursor:pointer;background:linear-gradient(135deg,var(--accent2),var(--accent));border:none}
    .ghost{background:transparent;border:1px solid #2b3a5d}
    .small{font-size:12px;color:#94a3b8}
    details.region{margin:12px 0;border:1px solid #2b3a5d;border-radius:8px;overflow:hidden}
    details.region>summary{list-style:none;cursor:pointer;padding:10px 12px;background:#0b1327;font-weight:700;color:var(--accent)}
    details.region>summary::-webkit-details-marker{display:none}
    details.region .inner{padding:8px 12px;background:#0f172a}
    .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
    .ok{color:#10b981}
    .warn{color:#f59e0b}
    .hide{display:none}
    /* ---- compact table view ---- */
    .tableWrap{margin:8px 0}
    .tbl{width:100%;border-collapse:collapse;border:1px solid #1f2937;background:#0b1327}
    .tbl th,.tbl td{padding:8px 10px;border-bottom:1px solid #1f2937;text-align:left}
    .tbl thead th{background:#0f172a;color:var(--muted);font-weight:600}
    .tbl tr:hover{background:#0e1832}
    .tbl td:first-child,.tbl th:first-child{white-space:nowrap;width:1%}
    .badge{display:inline-block;padding:2px 8px;border-radius:999px;font-weight:700;font-size:12px;border:1px solid #2b3a5d;margin-left:8px}
    .badge.yes{border-color:#065f46;color:#10b981;background:rgba(16,185,129,.08)}
    .small-muted{font-size:12px;color:#94a3b8;margin-left:8px}

    /* ===== ダッシュボード =====
       配色は cyan 単色の順序ランプ（--seq-1〜4）。dataviz の ordinal チェック
       （単一色相・輝度単調・段差・最明段のコントラスト）を surface #0b1327 に対して
       通したものなので、段の値を勝手に変えないこと。
       --seq-0 は「0件」専用でわざと背景に沈めてあり、必ず数値ラベルを併記する。 */
    #dashOverlay{
      position:fixed;inset:0;z-index:9998;display:none;overflow:auto;
      background:#0b1225;color:#e5e7eb;
      --d-surface:#0b1327; --d-plane:#0f172a;
      --d-ink:#e5e7eb; --d-ink2:#94a3b8; --d-muted:#64748b;
      --d-grid:#1f2937; --d-line:#2b3a5d;
      --seq-0:#131c33; --seq-1:#0e7490; --seq-2:#0891b2; --seq-3:#22d3ee; --seq-4:#67e8f9;
      --d-ok:#34d399;
    }
    #dashOverlay .dwrap{max-width:1100px;margin:0 auto;padding:16px 16px 48px}
    #dashOverlay h2{margin:0;font-size:20px}
    #dashOverlay h3{margin:0 0 12px;font-size:14px;font-weight:600;color:var(--d-ink2)}
    .dcard{background:var(--d-surface);border:1px solid var(--d-grid);border-radius:12px;padding:16px;margin-bottom:12px}
    .dgrid{display:grid;gap:12px}
    .dgrid.k4{grid-template-columns:repeat(2,1fr)}
    @media(min-width:720px){.dgrid.k4{grid-template-columns:repeat(4,1fr)}}

    /* ヒーロー数値：sans のまま、大きい数字は比例数字（tabular にしない） */
    .dhero{display:flex;flex-wrap:wrap;align-items:baseline;gap:12px}
    .dhero .big{font-size:56px;line-height:1;font-weight:600;color:var(--d-ink)}
    .dhero .sub{font-size:14px;color:var(--d-ink2)}
    .dmeter{height:14px;border-radius:999px;background:rgba(34,211,238,.14);overflow:hidden;margin-top:14px}
    .dmeter>i{display:block;height:100%;background:var(--seq-3);border-radius:0 4px 4px 0}

    .dtile .lbl{font-size:12px;color:var(--d-ink2)}
    .dtile .val{font-size:28px;font-weight:600;margin-top:4px}
    .dtile .note{font-size:12px;color:var(--d-muted);margin-top:2px}

    /* 地域別メーター行 */
    .drow{display:grid;grid-template-columns:88px 1fr auto;gap:10px;align-items:center;padding:5px 0}
    .drow .nm{font-size:13px;color:var(--d-ink2);white-space:nowrap}
    .drow .track{height:14px;border-radius:999px;background:rgba(34,211,238,.14)}
    .drow .track>i{display:block;height:100%;background:var(--seq-3);border-radius:0 4px 4px 0}
    .drow .vl{font-size:12px;color:var(--d-ink2);font-variant-numeric:tabular-nums;white-space:nowrap}

    /* エリアタイル（ヒートマップ） */
    .dregion{margin-bottom:14px}
    .dregion>.rt{font-size:12px;color:var(--d-muted);margin-bottom:6px}
    .dtiles{display:flex;flex-wrap:wrap;gap:6px}
    .dtile2{
      min-width:78px;padding:7px 9px;border-radius:8px;background:var(--seq-0);
      border:1px solid transparent;cursor:default;
    }
    .dtile2 .p{font-size:12px;font-weight:600;line-height:1.3}
    .dtile2 .c{font-size:11px;opacity:.85;font-variant-numeric:tabular-nums}
    .dtile2.z{border-color:var(--d-line);color:var(--d-muted)}
    .dscale{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:10px;font-size:11px;color:var(--d-muted)}
    .dscale span.sw{display:inline-block;width:16px;height:10px;border-radius:2px;vertical-align:-1px;margin-right:4px}

    /* 推移グラフ。狭い画面では縮小して軸の文字が潰れるので、
       カード内で横スクロールさせて可読サイズを保つ */
    .dchart{position:relative;overflow-x:auto}
    .dchart svg{display:block;width:100%;min-width:520px;height:auto}
    /* 長い表も同様にカード内でスクロールさせ、ページ自体は横に伸ばさない */
    .dscroll{overflow-x:auto}
    .dtip{
      position:absolute;pointer-events:none;background:var(--d-plane);border:1px solid var(--d-line);
      border-radius:8px;padding:6px 9px;font-size:12px;white-space:nowrap;opacity:0;transition:opacity .1s;
      box-shadow:0 4px 14px rgba(0,0,0,.4);z-index:2;
    }
    .dempty{color:var(--d-muted);font-size:13px;padding:18px 0;text-align:center}

    /* 表ビュー（アクセシビリティ用の同等表現） */
    .dtable{width:100%;border-collapse:collapse;font-size:13px}
    .dtable th,.dtable td{padding:6px 8px;border-bottom:1px solid var(--d-grid);text-align:left}
    .dtable thead th{color:var(--d-ink2);font-weight:600}
    .dtable td.n{text-align:right;font-variant-numeric:tabular-nums}
    @media print{
      #dashControls{display:none!important}
      #dashOverlay{position:static!important;overflow:visible!important}
    }
  </style>
</head>

  <h1>ちいかわ ご当地キーホルダー 所持チェック</h1>

    <button id="btnCSVAll">CSV (全件)</button>
    <span class="small" style="opacity:.85">地域→都道府県→名称で出力</span>
  </div>

  <!-- 認証UI -->
  <div class="wrap row" id="authRow">
    <button id="loginBtn" class="ghost">Googleでログイン</button>
    <button id="logoutBtn" class="ghost hide">ログアウト</button>
    <span id="userInfo" class="small"></span>
  </div>

  <!-- 家族コード＋同期UI -->
  <div class="wrap row" style="margin-top:6px">
    <input id="familyCode" placeholder="家族コード（例: my-family）" style="min-width:220px">
    <button id="connectBtn" class="ghost">同期オン</button>
    <button id="disconnectBtn" class="ghost">同期オフ</button>
    <span id="syncStatus" class="small">未接続</span>
  </div>
</header>

<main class="wrap" id="app"></main>

    {region:"海外",pref:"オーストラリア",name:"カンガルー"},
    {region:"海外",pref:"オーストラリア",name:"コアラ"},
    {region:"海外",pref:"マカオ",name:"アズレージョ"},
    {region:"海外",pref:"マカオ",name:"エッグタルト"},
    {region:"海外",pref:"マカオ",name:"セントポール"},
    {region:"海外",pref:"香港",name:"エッグワッフル"},
    {region:"海外",pref:"香港",name:"カンフー"},
    {region:"海外",pref:"香港",name:"ビクトリアハーバー"},
    {region:"その他",pref:"JR東海・西日本",name:"Dr.Yellow"},
    {region:"その他",pref:"JR東海・西日本",name:"N700S"},
    {region:"その他",pref:"JR東日本",name:"E7"},
    {region:"その他",pref:"JR東日本",name:"はやぶさ"},
    {region:"その他",pref:"リゾート",name:"スキー冬季限定"},
    {region:"その他",pref:"リゾート",name:"スノボー冬季限定"},
    {region:"その他",pref:"温泉地",name:"温泉"},
    {region:"その他",pref:"空港",name:"パイロット"}
  ];
  // <<<AUTO-CATALOG-END>>>

  // --- 旧データに「沖縄地方」が残っていても九州地方へマップする ---
  function migrateRegion(v){ return v==="沖縄地方" ? "九州地方" : v; }

  // 都道府県表記の統一（東京都/東京→東京、京都府→京都、大阪府→大阪、他は末尾の県・府を外す。北海道はそのまま）
  function normalizePref(p){
    let s = String(p || '').trim();
    if (!s) return '';
    if (s === '北海道') return s;
    if (s === '東京都' || s === '東京') return '東京';
    if (s === '京都府' || s === '京都') return '京都';
    if (s === '大阪府' || s === '大阪') return '大阪';
    // 一般: 末尾の「県」「府」を外す（「都」は外さない）
    s = s.replace(/県$/, '').replace(/府$/, '');
    return s;
  }

  // 正規化キー＆ホワイトリスト（FULL にある組み合わせだけ許可）
  function normalizedKey(region, pref, name){
    const r = migrateRegion(String(region || ''));
    const p = normalizePref(pref);
    const n = String(name || '');
    return `${r}__${p}__${n}`;
  }
  const VALID_KEY_SET = new Set(FULL.map(x => normalizedKey(x.region, x.pref, x.name)));

  function today(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
  function normalize(x){
    return{
      region: migrateRegion(String(x.region||'')),
      pref:   normalizePref(x.pref),
      name:   String(x.name||''),
      owned:  !!x.owned,
      ownedAt:x.ownedAt||null
    };
  }
  // 公式外や重複を除去
  function sanitize(arr){
    const out = [];
    const seen = new Set();
    for(const it0 of (arr || [])){
      const it = normalize(it0);
      const k = normalizedKey(it.region, it.pref, it.name);
      if(!VALID_KEY_SET.has(k)) continue; // FULLに無い → 捨てる
      if(seen.has(k)) continue;           // 重複も除去
      out.push(it); seen.add(k);
    }
    return out;
  }
  function load(){
    try{
      const a=JSON.parse(localStorage.getItem(LS_KEY));
      if(Array.isArray(a)) return a;
      return null;
    }catch{ return null }
  }

  // FULL にあって items に無いものを未所持で補充する。
  // 自動更新でカタログが増えたとき、localStorage に古い items が残っていても
  // 新商品が画面に出るようにするための処理。既存の所持状態には一切触らない。
  function mergeCatalog(list){
    const out = [...list];
    const have = new Set(out.map(it => normalizedKey(it.region, it.pref, it.name)));
    for(const x of FULL){
      const k = normalizedKey(x.region, x.pref, x.name);
      if(!have.has(k)){ out.push(normalize(x)); have.add(k); }
    }
    return out;
  }

  // 初期ロード：正規化＋ホワイトリストでクリーン化してから、新カタログを合流
  let items = mergeCatalog(sanitize(load() || FULL));
  // 以後の処理で使う前にローカルへ書き戻して正規化を確定させる
  function setStatus(t,cls=''){ syncStatus.textContent=t; syncStatus.className='small '+(cls||''); }

  /* ===== UI要素 ===== */
  const app=document.getElementById('app');
  const btnPrint=document.getElementById('btnPrint');
  const btnCSVAll=document.getElementById('btnCSVAll');
  const familyCodeInput=document.getElementById('familyCode');

  /* ===== Firebase 初期化・認証 ===== */
  const fb={app:null,auth:null,db:null,docRef:null,unsub:null,connected:false,applying:false,uid:null};
  fb.app = initializeApp(FIREBASE_CONFIG);
  fb.auth = getAuth(fb.app);
  fb.db = getFirestore(fb.app);
  const provider = new GoogleAuthProvider();

  // 保存（ローカル/クラウド）
  let pushTimer=null;
  function pushToCloudDebounced(){
    if(pushTimer) clearTimeout(pushTimer);
    pushTimer=setTimeout(()=>{ if(fb.docRef) setDoc(fb.docRef,{items, updatedAt: Date.now()}); },300);
  }
  function save(){
    try{
      localStorage.setItem(LS_KEY,JSON.stringify(items));
      if(fb.connected && !fb.applying) pushToCloudDebounced();
    }catch(e){
      console.error('localStorage save failed', e);
      setStatus('保存に失敗（ローカルストレージ）','warn');
    }
  }
  // ★初回ロード直後に保存（東京都→東京 等の統一と不要データ除去を確定）
  save();

  loginBtn.addEventListener('click', async () => {

    catch(e){ console.error('login error', e); setStatus('ログイン失敗','warn'); alert('ログインに失敗しました: ' + (e.code || e.message)); }
  });
  logoutBtn.addEventListener('click', async () => {

  });

  // ---- Firestore 同期 ----
  function disconnect(){
    if(fb.unsub) fb.unsub();
    fb.unsub=null; fb.connected=false; fb.docRef=null; setStatus('未接続');
  }
  function showError(prefix, e){
    console.error(prefix, e);
    const msg=(e && (e.code||e.message))?` (${e.code||e.message})`:'';
    setStatus(`エラー${msg}`,'warn');
  }
  function ensureLoggedIn(){
    if(!fb.auth.currentUser){ alert('まず Google でログインしてください。'); return false; }
    return true;
  }
  function mergeItems(remote, local){
    // 両方 normalize 済みデータでキー作成 → 東京都/東京などは自動マージ
    const map=new Map();
    for(const it of sanitize(local)){ // 念のためローカル側もクリーン化
      const k = normalizedKey(it.region, it.pref, it.name);
      map.set(k, it);
    }
    for(const it0 of sanitize(remote)){ // リモート側もクリーン化
      const it = it0;
      const k = normalizedKey(it.region, it.pref, it.name);
      if(!map.has(k)) map.set(k, it);
      else{
        const a=map.get(k);
        map.set(k,{...a,...it,owned:!!(a.owned||it.owned),ownedAt:a.ownedAt||it.ownedAt||null});
      }
    }
    // 相手側がまだ古いカタログのままでも、新商品が画面から消えないよう合流させる
    return mergeCatalog(sanitize([...map.values()]));
  }

  function connect(){
    if(!ensureLoggedIn()) return;
    const code=(familyCodeInput.value||'').trim();
    if(!code) return alert('家族コードを入力してください。');
    setStatus('接続中…');
    localStorage.setItem(FAMILY_KEY, code);

    fb.docRef = doc(fb.db,'families', code,'lists','default');

    getDoc(fb.docRef).then(async (snap)=>{
      if(snap.exists()){
        fb.applying=true;
        const remote=sanitize(snap.data().items||[]);
        items = mergeItems(remote, items);
        save();
        fb.applying=false;
        render();
      }else{
        await setDoc(fb.docRef,{items, updatedAt: Date.now()});
      }
      if(fb.unsub) fb.unsub();
      fb.unsub = onSnapshot(fb.docRef, s=>{
        if(!s.exists()) return;
        const remote=sanitize(s.data().items||[]);
        fb.applying=true; items = mergeItems(remote, items); save(); fb.applying=false; render();
      }, e=>showError('onSnapshot失敗', e));

      fb.connected=true; setStatus('同期中','ok');
    }).catch(e=>showError('getDoc失敗', e));
  }

  connectBtn.addEventListener('click', connect);
  disconnectBtn.addEventListener('click', disconnect);

  onAuthStateChanged(fb.auth, (u) => {
    fb.uid = u ? u.uid : null;
    if(u){
      loginBtn.classList.add('hide');
      logoutBtn.classList.remove('hide');
      userInfo.textContent = `ログイン中: ${u.email||u.uid}`;
      setStatus('ログイン済み');
      const saved = localStorage.getItem(FAMILY_KEY)||'';
      if(saved && !familyCodeInput.value) familyCodeInput.value = saved;
    }else{
      loginBtn.classList.remove('hide');
      logoutBtn.classList.add('hide');
      userInfo.textContent = '';
      setStatus('未接続');
      disconnect();
    }
  });

  /* ===== CSV/印刷ユーティリティ ===== */
  function sortForOutput(arr){
    return [...arr].sort((a,b)=>{
      const ra=(REGION_ORDER.indexOf(a.region)+1)||999;
      const rb=(REGION_ORDER.indexOf(b.region)+1)||999;
      if(ra!==rb) return ra-rb;
      const pa=prefRank(a.pref), pb=prefRank(b.pref);
      if(pa!==pb) return pa-pb;
      return (a.name||'').localeCompare(b.name||'','ja');
    });
  }
  function csvCell(v){ const s=(v??'').toString().replace(/"/g,'""'); return /[,"\n]/.test(s)?'"'+s+'"':s; }
  function toCSV(data){
    const header=['地域','都道府県','名称','所持','所持日'];
    const rows=data.map(x=>[x.region,x.pref,x.name,x.owned?1:0,x.ownedAt||''].map(csvCell).join(','));
    return ['\ufeff'+header.join(','),...rows].join('\n');
  }
  function downloadBlob(filename, text, mime='text/csv;charset=utf-8;'){
    const blob=new Blob([text],{type:mime});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a'); a.href=url; a.download=filename;
    document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
  }
  function exportCSV(data, filename='chiikawa_all.csv'){
    const sorted=sortForOutput(data);
    const csv=toCSV(sorted);
    downloadBlob(filename, csv);
  }
  document.getElementById('btnCSVAll').addEventListener('click', ()=>exportCSV(items,'chiikawa_all.csv'));

  /* ===== 一覧を同一ページにオーバーレイ表示（ポップアップ不要） ===== */
  function openPrintAll() {
    const ensureOverlay = () => {

    const data = sortForOutput(items || []);
    const esc = (s) => String(s ?? '')
      .replace(/&/g,'&amp;')

      : `<tr><td colspan="5">データがありません</td></tr>`;

    const overlay = ensureOverlay();
    overlay.innerHTML = `

        </div>
        <h2 style="margin:0 0 12px;color:#0b1225">ちいかわ ご当地キーホルダー 一覧</h2>
        <table style="width:100%;border-collapse:collapse;border:1px solid #e5e7eb" class="pretty">
          <thead>
            <tr style="background:#f8fafc">
              <th style="text-align:left;padding:8px 10px;border-bottom:1px solid #e5e7eb">地域</th>

  document.getElementById('btnPrint').addEventListener('click', openPrintAll);

  /* ===== ダッシュボード ===== */

  // 集計。items から必要な数字を一度に出す
  function dashAggregate(list){
    const total = list.length;
    const ownedItems = list.filter(x => x.owned);
    const owned = ownedItems.length;

    // 地域別
    const regions = [...new Set(list.map(it => migrateRegion(it.region)))]
      .sort((a,b) => (REGION_ORDER.indexOf(a)+1||999) - (REGION_ORDER.indexOf(b)+1||999) || a.localeCompare(b,'ja'))
      .map(r => {
        const rows = list.filter(it => migrateRegion(it.region) === r);
        return { name:r, total:rows.length, owned:rows.filter(x=>x.owned).length };
      });

    // エリア（都道府県相当）別。地域ごとにまとめる
    const areasByRegion = regions.map(r => {
      const rows = list.filter(it => migrateRegion(it.region) === r.name);
      const byPref = new Map();
      for(const it of rows){
        if(!byPref.has(it.pref)) byPref.set(it.pref, []);
        byPref.get(it.pref).push(it);
      }
      const areas = [...byPref].map(([pref, rs]) => ({
        pref: pref || '(未設定)',
        total: rs.length,
        owned: rs.filter(x=>x.owned).length,
        missing: rs.filter(x=>!x.owned).map(x=>x.name)
      })).sort((a,b) => (prefRank(a.pref)-prefRank(b.pref)) || a.pref.localeCompare(b.pref,'ja'));
      return { region:r.name, areas };
    });

    const allAreas = areasByRegion.flatMap(g => g.areas.map(a => ({...a, region:g.region})));
    const completeAreas = allAreas.filter(a => a.total > 0 && a.owned === a.total);

    // あと少しでコンプリートのエリア（残り1〜2件）。多いほど手前に出す
    const nearly = allAreas
      .filter(a => a.owned > 0 && a.owned < a.total && (a.total - a.owned) <= 2)
      .sort((a,b) => (a.total-a.owned) - (b.total-b.owned) || b.owned - a.owned);

    // 獲得の推移（ownedAt を月単位で累積）
    const dated = ownedItems.filter(x => /^\d{4}-\d{2}-\d{2}$/.test(x.ownedAt || ''));
    const undatedOwned = owned - dated.length;
    const byMonth = new Map();
    for(const x of dated){
      const m = x.ownedAt.slice(0,7);
      byMonth.set(m, (byMonth.get(m)||0) + 1);
    }
    const months = [...byMonth.keys()].sort();
    let running = 0;
    const timeline = months.map(m => ({ month:m, added:byMonth.get(m), cum:(running += byMonth.get(m)) }));

    // 直近30日の獲得数
    const cutoff = new Date(Date.now() - 30*86400000).toISOString().slice(0,10);
    const last30 = dated.filter(x => x.ownedAt >= cutoff).length;

    return { total, owned, regions, areasByRegion, allAreas, completeAreas, nearly, timeline, undatedOwned, last30 };
  }

  // 達成率 → 順序ランプの段。0件だけは背景に沈む段を使い、必ず数値を併記する
  function seqStep(owned, total){
    if(total === 0 || owned === 0) return 0;
    const r = owned / total;
    if(r >= 1) return 4;
    if(r >= 2/3) return 3;
    if(r >= 1/3) return 2;
    return 1;
  }
  // 段ごとの文字色。明るい段の上では濃いインクにしてコントラストを確保する
  const SEQ_INK = ['var(--d-muted)','#e5e7eb','#e5e7eb','#062a35','#062a35'];

  function pct(n, d){ return d ? Math.round(n/d*100) : 0; }
  const esc2 = (s) => String(s ?? '')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');

  // 累積の推移グラフ。単一系列なので凡例は置かず、終点だけ直接ラベルする
  function renderTimeline(timeline, totalCount){
    if(timeline.length < 2){
      return `<div class="dempty">推移を描くにはデータが足りません。<br>
        所持日が記録された月が2つ以上になると、ここに累積グラフが出ます。</div>`;
    }
    const W = 760, H = 220, mL = 44, mR = 56, mT = 14, mB = 28;
    const pw = W - mL - mR, ph = H - mT - mB;

    // Y軸は 0 起点でキリのいい上限に丸める
    const maxCum = timeline[timeline.length-1].cum;
    const step = maxCum <= 10 ? 2 : maxCum <= 30 ? 5 : maxCum <= 80 ? 10 : 25;
    const yMax = Math.max(step, Math.ceil(maxCum/step)*step);
    const X = i => mL + (timeline.length === 1 ? pw/2 : pw * i/(timeline.length-1));
    const Y = v => mT + ph - ph * (v/yMax);

    const ticks = [];
    for(let v=0; v<=yMax; v+=step) ticks.push(v);

    const grid = ticks.map(v =>
      `<line x1="${mL}" y1="${Y(v).toFixed(1)}" x2="${mL+pw}" y2="${Y(v).toFixed(1)}" stroke="var(--d-grid)" stroke-width="1"/>
       <text x="${mL-8}" y="${(Y(v)+4).toFixed(1)}" text-anchor="end" font-size="11" fill="var(--d-muted)" style="font-variant-numeric:tabular-nums">${v}</text>`
    ).join('');

    const pts = timeline.map((d,i) => `${X(i).toFixed(1)},${Y(d.cum).toFixed(1)}`);
    const area = `M${mL},${(mT+ph).toFixed(1)} L${pts.join(' L')} L${X(timeline.length-1).toFixed(1)},${(mT+ph).toFixed(1)} Z`;

    // X軸ラベルは最大6個。両端は必ず出し、末尾と近すぎる中間ラベルは落として重なりを防ぐ
    const last_i = timeline.length - 1;
    const everyI = Math.max(1, Math.round(last_i / 5));
    const labelIdx = new Set([0, last_i]);
    for(let i = everyI; i < last_i; i += everyI){
      if(last_i - i >= Math.max(1, Math.ceil(everyI/2))) labelIdx.add(i);
    }
    const xlabs = [...labelIdx].sort((a,b)=>a-b).map(i =>
      `<text x="${X(i).toFixed(1)}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--d-muted)">${timeline[i].month.replace('-','/')}</text>`
    ).join('');

    // ホバー用の当たり判定（マークより広く取る）
    const hit = timeline.map((d,i) => {
      const bw = pw / timeline.length;
      return `<rect class="dhit" data-i="${i}" x="${(X(i)-bw/2).toFixed(1)}" y="${mT}" width="${bw.toFixed(1)}" height="${ph}" fill="transparent"/>`;
    }).join('');

    const last = timeline[timeline.length-1];
    return `
      <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="所持数の累積推移">
        ${grid}
        <path d="${area}" fill="var(--seq-3)" fill-opacity="0.10"/>
        <polyline points="${pts.join(' ')}" fill="none" stroke="var(--seq-3)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
        <line class="dcross" x1="0" y1="${mT}" x2="0" y2="${mT+ph}" stroke="var(--d-line)" stroke-width="1" opacity="0"/>
        <circle class="dfocus" r="5" fill="var(--seq-3)" stroke="var(--d-surface)" stroke-width="2" opacity="0"/>
        <circle cx="${X(timeline.length-1).toFixed(1)}" cy="${Y(last.cum).toFixed(1)}" r="5" fill="var(--seq-3)" stroke="var(--d-surface)" stroke-width="2"/>
        <text x="${(X(timeline.length-1)+10).toFixed(1)}" y="${(Y(last.cum)+4).toFixed(1)}" font-size="12" fill="var(--d-ink)" style="font-variant-numeric:tabular-nums">${last.cum}個</text>
        ${xlabs}
        <line x1="${mL}" y1="${mT+ph}" x2="${mL+pw}" y2="${mT+ph}" stroke="var(--d-line)" stroke-width="1"/>
        ${hit}
      </svg>`;
  }

  function buildDashboard(){
    const a = dashAggregate(items);
    const rate = pct(a.owned, a.total);

    const tiles = [
      { lbl:'所持', val:a.owned, note:`全${a.total}個中` },
      { lbl:'未所持', val:a.total - a.owned, note:'残り' },
      { lbl:'コンプリート済みエリア', val:a.completeAreas.length, note:`全${a.allAreas.length}エリア中` },
      { lbl:'直近30日の獲得', val:(a.last30 ? '+'+a.last30 : '0'), note:'所持日の記録から' },
    ].map(t => `<div class="dcard dtile">
        <div class="lbl">${t.lbl}</div>
        <div class="val">${t.val}</div>
        <div class="note">${esc2(t.note)}</div>
      </div>`).join('');

    const regionRows = a.regions.map(r => `
      <div class="drow" title="${esc2(r.name)} ${r.owned}/${r.total}（${pct(r.owned,r.total)}%）">
        <div class="nm">${esc2(r.name)}</div>
        <div class="track"><i style="width:${pct(r.owned,r.total)}%"></i></div>
        <div class="vl">${r.owned}/${r.total}・${pct(r.owned,r.total)}%</div>
      </div>`).join('');

    const heat = a.areasByRegion.map(g => `
      <div class="dregion">
        <div class="rt">${esc2(g.region)}</div>
        <div class="dtiles">
          ${g.areas.map(ar => {
            const s = seqStep(ar.owned, ar.total);
            const tip = ar.owned === ar.total
              ? 'コンプリート'
              : '未所持: ' + (ar.missing.slice(0,6).join('、') + (ar.missing.length>6 ? ' ほか' : ''));
            return `<div class="dtile2${s===0?' z':''}" style="background:var(--seq-${s});color:${SEQ_INK[s]}"
                      title="${esc2(ar.pref)} ${ar.owned}/${ar.total}｜${esc2(tip)}">
              <div class="p">${esc2(ar.pref)}</div>
              <div class="c">${ar.owned}/${ar.total}</div>
            </div>`;
          }).join('')}
        </div>
      </div>`).join('');

    const scale = `<div class="dscale">
      <span><span class="sw" style="background:var(--seq-0);outline:1px solid var(--d-line)"></span>0%</span>
      <span><span class="sw" style="background:var(--seq-1)"></span>〜33%</span>
      <span><span class="sw" style="background:var(--seq-2)"></span>〜66%</span>
      <span><span class="sw" style="background:var(--seq-3)"></span>〜99%</span>
      <span><span class="sw" style="background:var(--seq-4)"></span>100%</span>
      <span style="margin-left:4px">※タイル内の数字でも読めます</span>
    </div>`;

    const nearlyRows = a.nearly.length
      ? a.nearly.slice(0,12).map(n => `<tr>
          <td>${esc2(n.pref)}<span class="small-muted">${esc2(n.region)}</span></td>
          <td class="n">${n.owned}/${n.total}</td>
          <td>${esc2(n.missing.join('、'))}</td>
        </tr>`).join('')
      : `<tr><td colspan="3" style="color:var(--d-muted)">残り2個以内のエリアはありません。</td></tr>`;

    const tableRows = a.allAreas.map(ar => `<tr>
        <td>${esc2(ar.region)}</td><td>${esc2(ar.pref)}</td>
        <td class="n">${ar.owned}</td><td class="n">${ar.total}</td><td class="n">${pct(ar.owned,ar.total)}%</td>
      </tr>`).join('');

    const undatedNote = a.undatedOwned
      ? `<div class="note" style="margin-top:8px;color:var(--d-muted);font-size:12px">
           所持日が未記録の${a.undatedOwned}個はグラフに含まれていません（合計には入っています）。</div>`
      : '';

    return `
      <div class="dwrap">
        <div class="row" id="dashControls" style="justify-content:flex-end;margin-bottom:8px">
          <button id="dToggleTable" class="ghost">表で見る</button>
          <button id="dClose" class="ghost">閉じる</button>
        </div>

        <h2 style="margin-bottom:12px">収集ダッシュボード</h2>

        <div class="dcard">
          <h3>全体の達成率</h3>
          <div class="dhero">
            <div class="big">${rate}%</div>
            <div class="sub">${a.owned} / ${a.total} 個</div>
          </div>
          <div class="dmeter"><i style="width:${rate}%"></i></div>
        </div>

        <div class="dgrid k4">${tiles}</div>

        <div class="dcard">
          <h3>地域別の達成状況</h3>
          ${regionRows}
        </div>

        <div class="dcard">
          <h3>エリア別の収集状況</h3>
          ${heat}
          ${scale}
        </div>

        <div class="dcard">
          <h3>所持数の推移（累積）</h3>
          <div class="dchart">${renderTimeline(a.timeline, a.total)}<div class="dtip"></div></div>
          ${undatedNote}
        </div>

        <div class="dcard">
          <h3>あと少しでコンプリート</h3>
          <div class="dscroll">
            <table class="dtable">
              <thead><tr><th>エリア</th><th class="n">所持</th><th>足りない商品</th></tr></thead>
              <tbody>${nearlyRows}</tbody>
            </table>
          </div>
        </div>

        <div class="dcard hide" id="dTableView">
          <h3>エリア別の数値（表）</h3>
          <div class="dscroll">
            <table class="dtable">
              <thead><tr><th>地域</th><th>エリア</th><th class="n">所持</th><th class="n">全体</th><th class="n">達成率</th></tr></thead>
              <tbody>${tableRows}</tbody>
            </table>
          </div>
        </div>
      </div>`;
  }

  function openDashboard(){
    let el = document.getElementById('dashOverlay');
    if(!el){
      el = document.createElement('div');
      el.id = 'dashOverlay';
      document.body.appendChild(el);
    }
    el.innerHTML = buildDashboard();
    el.style.display = 'block';
    el.scrollTop = 0;

    el.querySelector('#dClose').onclick = () => { el.style.display='none'; el.innerHTML=''; };
    const tv = el.querySelector('#dTableView');
    el.querySelector('#dToggleTable').onclick = (ev) => {
      tv.classList.toggle('hide');
      ev.currentTarget.textContent = tv.classList.contains('hide') ? '表で見る' : '表を隠す';
      if(!tv.classList.contains('hide')) tv.scrollIntoView({behavior:'smooth', block:'start'});
    };

    // 推移グラフのホバー（クロスヘア＋ツールチップ）。値は表ビューでも読めるので補助扱い
    const chart = el.querySelector('.dchart');
    const svg = chart && chart.querySelector('svg');
    if(svg){
      const a = dashAggregate(items);
      const tip = chart.querySelector('.dtip');
      const cross = svg.querySelector('.dcross');
      const focus = svg.querySelector('.dfocus');
      const hits = [...svg.querySelectorAll('.dhit')];
      const pts = [...svg.querySelectorAll('polyline')][0].getAttribute('points').split(' ').map(s=>s.split(',').map(Number));

      const show = (i) => {
        const [cx, cy] = pts[i];
        const d = a.timeline[i];
        cross.setAttribute('x1', cx); cross.setAttribute('x2', cx); cross.setAttribute('opacity','1');
        focus.setAttribute('cx', cx); focus.setAttribute('cy', cy); focus.setAttribute('opacity','1');
        const sx = svg.getBoundingClientRect().width / svg.viewBox.baseVal.width;
        tip.innerHTML = `<b>${d.month.replace('-','年')}月</b><br>累積 ${d.cum}個（+${d.added}）`;
        tip.style.opacity = '1';
        // 横スクロールする器なので、可視領域ではなく SVG 座標系の中で収める
        const tw = tip.offsetWidth;
        const maxLeft = svg.getBoundingClientRect().width - tw;
        tip.style.left = Math.max(0, Math.min(maxLeft, cx*sx - tw/2)) + 'px';
        tip.style.top = Math.max(0, cy*sx - tip.offsetHeight - 12) + 'px';
      };
      // 隠すときは位置も戻す。出しっぱなしの座標が器の幅を広げてしまうため
      const hide = () => {
        tip.style.opacity='0'; tip.style.left='0px'; tip.style.top='0px';
        cross.setAttribute('opacity','0'); focus.setAttribute('opacity','0');
      };
      hits.forEach(h => {
        const i = Number(h.dataset.i);
        h.addEventListener('mouseenter', () => show(i));
        h.addEventListener('focus', () => show(i));
        h.setAttribute('tabindex','0');
      });
      svg.addEventListener('mouseleave', hide);
      svg.addEventListener('blur', hide, true);
    }
  }

  document.getElementById('btnDash').addEventListener('click', openDashboard);

  /* ===== 画面描画（2カラム） ===== */
  const regionSummaryEl = new Map();

  function updateStats(){
    const ownTotal=items.filter(x=>x.owned).length;
    document.getElementById('stats').textContent =
      `${ownTotal}/${items.length} 所持 (${items.length?Math.round(ownTotal/items.length*100):0}%)`;
  }

  function render(){
    app.innerHTML='';
    regionSummaryEl.clear();

    const regions=[...new Set(items.map(it=>migrateRegion(it.region)))]
      .sort((a,b)=>(REGION_ORDER.indexOf(a)+1||999)-(REGION_ORDER.indexOf(b)+1||999)||a.localeCompare(b,'ja'));

    const frag=document.createDocumentFragment();

    for(const r of regions){
      const rItems=items.filter(it=>migrateRegion(it.region)===r);
      const ownR=rItems.filter(x=>x.owned).length;

      const details=document.createElement('details');
      details.className='region';
      details.open=(localStorage.getItem(LS_KEY+'_open_'+r)==='1');

      const summary=document.createElement('summary');
      summary.textContent=`${r} ${ownR}/${rItems.length}`;
      details.appendChild(summary);
      regionSummaryEl.set(r, summary);

      const inner=document.createElement('div');
      inner.className='inner';

      const byPref={};
      for(const it of rItems){
        (byPref[it.pref]||(byPref[it.pref]=[])).push(it);
      }
      const prefNames=Object.keys(byPref).sort((a,b)=>{
        const ra=prefRank(a), rb=prefRank(b);
        return (ra-rb) || a.localeCompare(b,'ja');
      });

      const wrap=document.createElement('div'); wrap.className='tableWrap';
      const table=document.createElement('table'); table.className='tbl';
      const thead=document.createElement('thead'); const trh=document.createElement('tr');
      ["都道府県","名称"].forEach(t=>{const th=document.createElement('th'); th.textContent=t; trh.appendChild(th);});
      thead.appendChild(trh); table.appendChild(thead);

      const tbody=document.createElement('tbody');
      for(const p of prefNames){
        const rows=byPref[p].sort((a,b)=>(a.name||'').localeCompare(b.name||'','ja'));
        rows.forEach((it,idx)=>{
          const tr=document.createElement('tr');

          const tdPref=document.createElement('td');
          if(idx===0){ tdPref.textContent=p; tdPref.style.whiteSpace='nowrap'; } else { tdPref.textContent=''; }
          tr.appendChild(tdPref);

          const tdName=document.createElement('td');
          const rowBox=document.createElement('div'); rowBox.className='row';

          const cb=document.createElement('input'); cb.type='checkbox'; cb.checked=!!it.owned;
          cb.addEventListener('click', (e)=> e.stopPropagation());
          cb.addEventListener('change', (ev) => {
            const checked = ev.currentTarget.checked;
            it.owned = checked;
            it.ownedAt = checked ? (it.ownedAt || today()) : null;

            const ownedBadge = rowBox.querySelector('span.badge');
            const dateSmall = rowBox.querySelector('span.small-muted');
            ownedBadge.classList.toggle('yes', checked);
            ownedBadge.textContent = checked ? '所持' : '未所持';
            dateSmall.textContent = it.ownedAt ? `(${it.ownedAt})` : '';

            const rNow = migrateRegion(it.region);
            const rAll = items.filter(x=>migrateRegion(x.region)===rNow);
            const rOwn = rAll.filter(x=>x.owned).length;
            const sumEl = regionSummaryEl.get(rNow);
            if(sumEl) sumEl.textContent = `${rNow} ${rOwn}/${rAll.length}`;

            updateStats();

            try { save(); } catch(e){ console.error('save() failed', e); setStatus('保存に失敗（コンソール参照）','warn'); }
            ev.stopPropagation();
          });

          const nameSpan=document.createElement('span'); nameSpan.textContent=it.name;
          const ownedBadge=document.createElement('span'); ownedBadge.className='badge'+(it.owned?' yes':''); ownedBadge.textContent=it.owned?'所持':'未所持';
          const dateSmall=document.createElement('span'); dateSmall.className='small-muted'; dateSmall.textContent = it.ownedAt ? `(${it.ownedAt})` : '';

          rowBox.append(cb, nameSpan, ownedBadge, dateSmall);
          tdName.appendChild(rowBox);
          tr.appendChild(tdName);

          tbody.appendChild(tr);
        });
      }

      table.appendChild(tbody); wrap.appendChild(table); inner.appendChild(wrap);
      details.appendChild(inner);
      details.addEventListener('toggle',()=>localStorage.setItem(LS_KEY+'_open_'+r,details.open?'1':'0'));
      frag.appendChild(details);
    }

    app.appendChild(frag);
    updateStats();
  }

  // 初期描画（家族コード復元）
  const savedFamily = localStorage.getItem(FAMILY_KEY)||'';
  if(savedFamily) familyCodeInput.value = savedFamily;
  render();
})(); // IIFE
</script>
</body>
</html>
