<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>ちいかわ ご当地キーホルダー 所持チェック（家族共有・Googleログイン）</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    /* ===== デザイントークン =====
       ピンクの4段（--pink-1〜4）は白背景に対して順序ランプとして検証済み
       （単一色相・輝度単調・段差・最明段2.22:1）。段の値は変えないこと。
       文字に使う --pink-ink は 6.38:1、--mint-ink は 5.47:1。 */
    :root{
      --bg:#fbfaf7;
      --surface:#ffffff;
      --surface-2:#f6f2ec;
      --line:#ece7df;
      --line-2:#ddd5c9;

      --ink:#1f1b18;
      --ink-2:#6b6058;
      --ink-3:#8a7f74;

      --pink-1:#f48ebd; --pink-2:#e85d9d; --pink-3:#c93b7c; --pink-4:#9c1f5b;
      --pink-ink:#b02466;
      --pink-wash:#fdeff6;
      --mint:#14b8a6;
      --mint-ink:#0f766e;
      --mint-wash:#e8faf7;

      --r:16px; --r-sm:12px; --r-xs:9px;
      --sh-1:0 1px 2px rgba(31,27,24,.05);
      --sh-2:0 6px 20px -6px rgba(31,27,24,.16);
      --sh-3:0 18px 48px -14px rgba(31,27,24,.28);
    }
    *{box-sizing:border-box}
    body{
      margin:0;background:var(--bg);color:var(--ink);
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans JP",sans-serif;
      -webkit-font-smoothing:antialiased;
    }
    .wrap{max-width:1080px;margin:auto;padding:0 16px}
    .hide{display:none !important}

    /* ---- ボタンの基本形 ---- */
    button{font:inherit;cursor:pointer;border-radius:999px;border:1px solid transparent;transition:background .15s,border-color .15s,color .15s,transform .1s}
    button:active{transform:scale(.97)}
    .btn{padding:9px 16px;font-size:14px;font-weight:600;background:var(--ink);color:#fff}
    .btn:hover{background:#000}
    .btn.accent{background:var(--pink-2);color:#fff}
    .btn.accent:hover{background:var(--pink-3)}
    .btn.ghost{background:var(--surface);color:var(--ink-2);border-color:var(--line-2)}
    .btn.ghost:hover{background:var(--surface-2);color:var(--ink)}
    .btn.sm{padding:6px 12px;font-size:13px}
    .icon-btn{
      width:38px;height:38px;display:grid;place-items:center;font-size:17px;
      background:var(--surface);border-color:var(--line-2);color:var(--ink-2);
    }
    .icon-btn:hover{background:var(--surface-2)}
    input,select{
      font:inherit;padding:9px 12px;border-radius:var(--r-sm);
      border:1px solid var(--line-2);background:var(--surface);color:var(--ink);
    }
    input:focus,select:focus,button:focus-visible{outline:2px solid var(--pink-2);outline-offset:1px}
    .small{font-size:12px;color:var(--ink-2)}
    .small-muted{font-size:11.5px;color:var(--ink-3);margin-left:7px;font-weight:500}

    /* ---- ヘッダー ---- */
    header.topbar{
      position:sticky;top:0;z-index:20;background:rgba(251,250,247,.88);
      backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line);
    }
    .brandrow{display:flex;align-items:center;gap:12px;padding:14px 0 10px}
    h1{margin:0;font-size:19px;font-weight:700;letter-spacing:.01em;flex:1;min-width:0}
    h1 small{display:block;font-size:11px;font-weight:600;color:var(--ink-3);letter-spacing:.08em;margin-bottom:2px}

    /* 進捗ヒーロー */
    .phero{display:flex;align-items:center;gap:14px;padding-bottom:12px}
    .phero .nums{font-size:15px;font-weight:600;white-space:nowrap}
    .phero .nums b{font-size:26px;font-weight:700;margin-right:1px}
    .phero .nums span{color:var(--ink-3);font-weight:600}
    .phero .bar{flex:1;height:10px;border-radius:999px;background:var(--surface-2);overflow:hidden;min-width:60px}
    .phero .bar>i{display:block;height:100%;background:var(--pink-2);border-radius:0 999px 999px 0;transition:width .35s}
    .phero .pct{font-size:14px;font-weight:700;color:var(--pink-ink);white-space:nowrap}

    /* ツールバー（検索＋絞り込み） */
    .toolbar{display:flex;gap:8px;align-items:center;padding-bottom:12px;flex-wrap:wrap}
    .search{position:relative;flex:1;min-width:190px}
    .search input{width:100%;padding-left:34px}
    .search .mag{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--ink-3);font-size:14px;pointer-events:none}
    .search .clr{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:24px;height:24px;border-radius:999px;border:none;background:var(--surface-2);color:var(--ink-2);display:grid;place-items:center;font-size:13px}
    .seg{display:flex;background:var(--surface-2);border-radius:999px;padding:3px;gap:2px}
    .seg button{padding:6px 13px;font-size:13px;font-weight:600;background:transparent;color:var(--ink-2);border:none}
    .seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--sh-1)}

    /* ---- 地域セクション ---- */
    .region{margin:22px 0}
    .rhead{display:flex;align-items:center;gap:12px;margin-bottom:10px}
    .rhead h2{margin:0;font-size:15px;font-weight:700;white-space:nowrap}
    .rhead .bar{flex:1;height:6px;border-radius:999px;background:var(--surface-2);overflow:hidden;min-width:40px}
    .rhead .bar>i{display:block;height:100%;background:var(--pink-2);border-radius:0 999px 999px 0}
    .rhead .cnt{font-size:12px;font-weight:600;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
    .rhead .done{color:var(--mint-ink)}

    /* 都道府県はタイル側に小さく出す。県ごとにグリッドを分けると
       1件しかない県が丸ごと1行を占めてしまい、縦に伸びすぎるため。 */
    .tile .tpref{font-size:9.5px;font-weight:700;color:var(--ink-3);letter-spacing:.04em;line-height:1}

    /* ---- 図鑑タイル ---- */
    .tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:9px}
    .tile{
      position:relative;display:flex;flex-direction:column;gap:7px;
      padding:9px;border-radius:var(--r-sm);border:1px solid var(--line);
      background:var(--surface);text-align:left;box-shadow:var(--sh-1);
      transition:transform .12s,box-shadow .12s,border-color .12s,background .12s;
    }
    .tile:hover{transform:translateY(-2px);box-shadow:var(--sh-2)}
    .tile .thumb{
      aspect-ratio:1/1;border-radius:var(--r-xs);background:var(--surface-2);
      display:grid;place-items:center;font-size:24px;overflow:hidden;position:relative;
    }
    .tile .thumb img{width:100%;height:100%;object-fit:cover;display:block}
    .tile .tname{font-size:12.5px;font-weight:600;line-height:1.35;color:var(--ink);word-break:break-word}
    .tile .tdate{
      font-size:10.5px;color:var(--ink-3);font-variant-numeric:tabular-nums;
      background:none;border:none;padding:2px 0 0;margin:0;text-align:left;border-radius:4px;
    }
    .tile .tdate:hover{color:var(--pink-ink);text-decoration:underline;text-underline-offset:2px}
    .tile .dateedit{font-size:11px;padding:3px 5px;border-radius:6px;width:100%}
    /* 未所持は彩度を落として沈める */
    .tile:not(.owned) .thumb{filter:grayscale(1);opacity:.42}
    .tile:not(.owned) .tname{color:var(--ink-2);font-weight:500}
    /* 所持はピンクで点灯 */
    .tile.owned{border-color:var(--pink-1);background:var(--pink-wash)}
    .tile .chk{
      position:absolute;top:6px;right:6px;width:21px;height:21px;border-radius:999px;
      display:grid;place-items:center;font-size:12px;font-weight:700;
      background:var(--surface);border:1px solid var(--line-2);color:transparent;
      box-shadow:var(--sh-1);
    }
    .tile.owned .chk{background:var(--pink-2);border-color:var(--pink-2);color:#fff}

    .emptystate{padding:44px 16px;text-align:center;color:var(--ink-3);font-size:14px}

    /* ===== 旅行モード =====
       現地で見る画面。選んだ土地の未所持だけを大きく出す。 */
    #travel{position:fixed;inset:0;z-index:45;display:none;overflow:auto;background:var(--bg)}
    #travel .twrap{max-width:820px;margin:0 auto;padding:16px 16px 56px}
    .thead{display:flex;align-items:center;gap:10px;padding:6px 0 14px}
    .thead h2{margin:0;font-size:20px;font-weight:700;flex:1;min-width:0}
    .thead h2 small{display:block;font-size:11px;font-weight:600;color:var(--ink-3);letter-spacing:.08em}
    /* 土地を選ぶ画面 */
    .tpicks{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
    .tpick{
      padding:12px 10px;border-radius:var(--r-sm);border:1px solid var(--line);
      background:var(--surface);text-align:left;box-shadow:var(--sh-1);
    }
    .tpick:hover{border-color:var(--pink-1);background:var(--pink-wash)}
    .tpick.clear{border-color:var(--mint);background:var(--mint-wash)}
    .tpick .pn{font-size:14px;font-weight:700}
    .tpick .pc{font-size:11px;color:var(--ink-2);margin-top:3px;font-variant-numeric:tabular-nums}
    .tpick .pc.done{color:var(--mint-ink);font-weight:700}
    .tsection{font-size:11.5px;font-weight:700;color:var(--ink-3);margin:18px 0 8px;letter-spacing:.04em}
    /* 未所持の一覧（現地で見るので大きく） */
    .tlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
    .tcard{
      display:flex;flex-direction:column;gap:9px;padding:12px;border-radius:var(--r);
      border:1px solid var(--line);background:var(--surface);box-shadow:var(--sh-1);text-align:left;
    }
    .tcard:hover{box-shadow:var(--sh-2)}
    .tcard .thumb{aspect-ratio:1/1;border-radius:var(--r-sm);background:var(--surface-2);display:grid;place-items:center;font-size:40px;overflow:hidden}
    .tcard .thumb img{width:100%;height:100%;object-fit:cover;display:block}
    .tcard .nm{font-size:15px;font-weight:700;line-height:1.35}
    .tcard .got{
      margin-top:2px;padding:9px 0;border-radius:999px;font-size:13.5px;font-weight:700;
      background:var(--pink-2);color:#fff;border:none;
    }
    .tcard .got:hover{background:var(--pink-3)}
    .tdone{
      padding:34px 18px;text-align:center;border-radius:var(--r);
      background:var(--mint-wash);border:1px solid var(--mint);
    }
    .tdone .big{font-size:30px;font-weight:700;color:var(--mint-ink)}
    .tdone .sub{margin-top:6px;font-size:13px;color:var(--ink-2)}
    .tflash{
      position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:60;
      background:var(--ink);color:#fff;padding:11px 18px;border-radius:999px;
      font-size:13.5px;font-weight:600;box-shadow:var(--sh-2);opacity:0;transition:opacity .2s;
      pointer-events:none;
    }
    .tflash.show{opacity:1}

    /* ---- 設定シート ---- */
    .sheet{
      position:fixed;inset:0;z-index:40;display:none;
      background:rgba(31,27,24,.32);backdrop-filter:blur(2px);
    }
    .sheet.open{display:block}
    .sheet .panel{
      position:absolute;right:0;top:0;bottom:0;width:min(380px,100%);
      background:var(--surface);border-left:1px solid var(--line);
      box-shadow:var(--sh-3);padding:18px;overflow:auto;
    }
    .sheet h3{margin:0 0 4px;font-size:15px}
    .sheet .sec{padding:16px 0;border-bottom:1px solid var(--line)}
    .sheet .sec:last-child{border-bottom:none}
    .sheet .sec p{margin:4px 0 10px;font-size:12.5px;color:var(--ink-2);line-height:1.6}
    .sheet .stack{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
    /* 家族コードは幅が要るので単独の行に置く */
    .sheet .stack input{flex-basis:100%;width:100%}
    /* シートを開いている間は後ろを動かさない */
    body.locked{overflow:hidden}
    .ok{color:var(--mint-ink)}
    .warn{color:#b45309}

    /* ===== 新着のお知らせ =====
       新着が無いときも枠自体は残す。その場合は .quiet を付けて、
       アクセント色を使わない静かな見た目にする。 */
    .news{
      margin:0 0 12px;padding:11px 13px;border-radius:var(--r-sm);
      background:var(--pink-wash);border:1px solid var(--pink-1);
      display:flex;gap:10px;align-items:flex-start;
    }
    .news.quiet{background:var(--surface);border-color:var(--line)}
    .news.quiet .ic{opacity:.45}
    .news.quiet .ttl{color:var(--ink-2)}
    .news.quiet .lst{color:var(--ink-3)}
    .news .ic{font-size:15px;line-height:1.45}
    .news .bd{flex:1;min-width:0}
    .news .ttl{font-weight:700;font-size:13.5px;color:var(--pink-ink)}
    .news .lst{margin:4px 0 0;font-size:12.5px;color:var(--ink-2);line-height:1.75}
    .news .lst button{
      background:none;border:none;padding:0;margin:0 1px;color:var(--ink-2);
      font:inherit;cursor:pointer;text-decoration:underline;text-underline-offset:2px;border-radius:3px;
    }
    .news .lst button:hover{color:var(--pink-ink)}
    .news .act{display:flex;gap:6px;flex-shrink:0}
    @media(max-width:560px){
      .news{flex-wrap:wrap}
      .news .act{width:100%;justify-content:flex-end}
    }

    /* ---- 狭い画面の詰め ---- */
    @media(max-width:560px){
      h1{font-size:16px;line-height:1.35}
      h1 small{font-size:10px}
      /* 狭い画面では見出しを1行に収める */
      h1 .t-long{display:none}
      .brandrow{gap:8px;padding:12px 0 8px}
      #btnDash{padding:8px 13px;font-size:13px}
      .icon-btn{width:34px;height:34px;font-size:15px}
      .phero .nums b{font-size:23px}
      /* タイルは3列にして、1画面に入る数を増やす */
      .tiles{grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:7px}
      .tile{padding:7px;gap:6px}
      .tile .tname{font-size:11.5px}
      .tile .chk{width:19px;height:19px;font-size:11px}
      .rhead h2{font-size:14px}
    }

    /* ===== ダッシュボード =====
       ヒートマップの配色はピンク単色の順序ランプ（--pink-1〜4）。
       白背景に対して dataviz の ordinal チェックを通してあるので段の値は変えないこと。
       --seq-0 は「0件」専用でわざと背景に沈めてあり、必ず数値ラベルを併記する。 */
    #dashOverlay{
      position:fixed;inset:0;z-index:40;display:none;overflow:auto;
      background:var(--bg);color:var(--ink);
      --seq-0:#f6f2ec;
    }
    #dashOverlay .dwrap{max-width:1080px;margin:0 auto;padding:16px 16px 56px}
    #dashOverlay h2{margin:0;font-size:22px;font-weight:700}
    #dashOverlay h3{margin:0 0 13px;font-size:13px;font-weight:700;color:var(--ink-3);letter-spacing:.03em}
    .dcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:12px;box-shadow:var(--sh-1)}
    .dgrid{display:grid;gap:12px}
    .dgrid.k4{grid-template-columns:repeat(2,1fr)}
    @media(min-width:720px){.dgrid.k4{grid-template-columns:repeat(4,1fr)}}

    /* ヒーロー数値：大きい数字は比例数字（tabular にしない） */
    .dhero{display:flex;flex-wrap:wrap;align-items:baseline;gap:12px}
    .dhero .big{font-size:58px;line-height:1;font-weight:700;color:var(--pink-ink);letter-spacing:-.02em}
    .dhero .sub{font-size:14px;color:var(--ink-2)}
    .dmeter{height:12px;border-radius:999px;background:var(--surface-2);overflow:hidden;margin-top:16px}
    .dmeter>i{display:block;height:100%;background:var(--pink-2);border-radius:0 4px 4px 0}

    .dtile .lbl{font-size:12px;color:var(--ink-2)}
    .dtile .val{font-size:30px;font-weight:700;margin-top:5px;letter-spacing:-.01em}
    .dtile .note{font-size:11.5px;color:var(--ink-3);margin-top:3px}

    /* 地域別メーター行 */
    .drow{display:grid;grid-template-columns:88px 1fr auto;gap:10px;align-items:center;padding:5px 0}
    .drow .nm{font-size:13px;color:var(--ink-2);white-space:nowrap}
    .drow .track{height:12px;border-radius:999px;background:var(--surface-2)}
    .drow .track>i{display:block;height:100%;background:var(--pink-2);border-radius:0 4px 4px 0}
    .drow .vl{font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}

    /* エリアタイル（ヒートマップ） */
    .dregion{margin-bottom:15px}
    .dregion>.rt{font-size:11.5px;font-weight:700;color:var(--ink-3);margin-bottom:7px}
    .dtiles{display:flex;flex-wrap:wrap;gap:6px}
    .dtile2{
      min-width:80px;padding:7px 9px;border-radius:var(--r-xs);background:var(--seq-0);
      border:1px solid transparent;cursor:default;
    }
    .dtile2 .p{font-size:12px;font-weight:700;line-height:1.3}
    .dtile2 .c{font-size:11px;opacity:.9;font-variant-numeric:tabular-nums}
    .dtile2.z{border-color:var(--line-2);color:var(--ink-3)}
    .dscale{display:flex;flex-wrap:wrap;align-items:center;gap:9px;margin-top:12px;font-size:11px;color:var(--ink-3)}
    .dscale span.sw{display:inline-block;width:16px;height:10px;border-radius:2px;vertical-align:-1px;margin-right:4px}

    /* 推移グラフ。狭い画面では縮小して軸の文字が潰れるので、
       カード内で横スクロールさせて可読サイズを保つ */
    .dchart{position:relative;overflow-x:auto}
    .dchart svg{display:block;width:100%;min-width:520px;height:auto}
    /* 長い表も同様にカード内でスクロールさせ、ページ自体は横に伸ばさない */
    .dscroll{overflow-x:auto}
    .dtip{
      position:absolute;pointer-events:none;background:var(--ink);color:#fff;border:none;
      border-radius:var(--r-xs);padding:7px 10px;font-size:12px;white-space:nowrap;opacity:0;transition:opacity .1s;
      box-shadow:var(--sh-2);z-index:2;
    }
    .dempty{color:var(--ink-3);font-size:13px;padding:22px 0;text-align:center;line-height:1.8}

    /* 表ビュー（アクセシビリティ用の同等表現） */
    .dtable{width:100%;border-collapse:collapse;font-size:13px}
    .dtable th,.dtable td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:left}
    .dtable thead th{color:var(--ink-3);font-weight:700;font-size:12px}
    .dtable td.n{text-align:right;font-variant-numeric:tabular-nums}
    @media print{
      #dashControls{display:none!important}
      #dashOverlay{position:static!important;overflow:visible!important}
    }
  </style>
</head>
<body>
<header class="topbar">
  <div class="wrap">
    <div class="brandrow">
      <h1><small>ご当地ちいかわ</small><span class="t-long">キーホルダー </span>コレクション</h1>
      <button id="btnTravel" class="btn accent">🧭 旅行モード</button>
      <button id="btnDash" class="btn ghost">ダッシュボード</button>
      <button id="btnSettings" class="icon-btn" aria-label="設定と同期" title="設定と同期">⚙</button>
    </div>

    <!-- 進捗（この画面の主役） -->
    <div class="phero">
      <div class="nums"><b id="hOwned">0</b><span id="hTotal"> / 0</span></div>
      <div class="bar"><i id="hBar" style="width:0%"></i></div>
      <div class="pct" id="hPct">0%</div>
    </div>

    <div id="newsBar"></div>

    <!-- 検索と絞り込み -->
    <div class="toolbar">
      <div class="search">
        <span class="mag">🔍</span>
        <input id="q" type="search" placeholder="名前や都道府県で探す" autocomplete="off">
        <button id="qClear" class="clr hide" aria-label="検索をクリア">✕</button>
      </div>
      <div class="seg" id="filterSeg" role="group" aria-label="表示の絞り込み">
        <button data-f="all"  aria-pressed="true">すべて</button>
        <button data-f="todo" aria-pressed="false">未所持</button>
        <button data-f="own"  aria-pressed="false">所持</button>
      </div>
    </div>
  </div>
</header>

<main class="wrap" id="app"></main>

<!-- 設定と同期（普段は使わないものはここへ隠す） -->
<div class="sheet" id="settings">
  <div class="panel">
    <div class="brandrow" style="padding-top:0">
      <h1 style="font-size:16px">設定と同期</h1>
      <button id="setClose" class="icon-btn" aria-label="閉じる">✕</button>
    </div>

    <div class="sec">
      <h3>家族で共有する</h3>

  function normalizePref(p){
    let s = String(p || '').trim();
    if (!s) return '';
    if (s === '北海道') return s;
    if (s === '東京都' || s === '東京') return '東京';
    if (s === '京都府' || s === '京都') return '京都';
    if (s === '大阪府' || s === '大阪') return '大阪';
    // 一般: 末尾の「県」「府」を外す（「都」は外さない）
    s = s.replace(/県$/, '').replace(/府$/, '');
    return s;
  }

      region: migrateRegion(String(x.region||'')),
      pref:   normalizePref(x.pref),
      name:   String(x.name||''),
      owned:  !!x.owned,
      ownedAt:x.ownedAt||null
    };
  }

    const out = [];

    for(const it0 of (arr || [])){

      const k = normalizedKey(it.region, it.pref, it.name);
      if(!VALID_KEY_SET.has(k)) continue; // FULLに無い → 捨てる
      if(seen.has(k)) continue;           // 重複も除去
      out.push(it); seen.add(k);
    }

  const SEEN_KEY = LS_KEY + '__seen';

        ? new Set(sanitize(savedRaw).map(it => normalizedKey(it.region, it.pref, it.name)))

  save();

  function showError(prefix, e){
    console.error(prefix, e);
    const msg=(e && (e.code||e.message))?` (${e.code||e.message})`:'';
    setStatus(`エラー${msg}`,'warn');
  }
  function ensureLoggedIn(){
    if(!fb.auth.currentUser){ alert('まず Google でログインしてください。'); return false; }
    return true;
  }
  function mergeItems(remote, local){
    // 両方 normalize 済みデータでキー作成 → 東京都/東京などは自動マージ
    const map=new Map();
    for(const it of sanitize(local)){ // 念のためローカル側もクリーン化
      const k = normalizedKey(it.region, it.pref, it.name);
      map.set(k, it);
    }
    for(const it0 of sanitize(remote)){ // リモート側もクリーン化
      const it = it0;
      const k = normalizedKey(it.region, it.pref, it.name);
      if(!map.has(k)) map.set(k, it);
      else{
        const a=map.get(k);
        map.set(k,{...a,...it,owned:!!(a.owned||it.owned),ownedAt:a.ownedAt||it.ownedAt||null});
      }
    }
    // 相手側がまだ古いカタログのままでも、新商品が画面から消えないよう合流させる
    return mergeCatalog(sanitize([...map.values()]));
  }

  function connect(){
    if(!ensureLoggedIn()) return;
    const code=(familyCodeInput.value||'').trim();
    if(!code) return alert('家族コードを入力してください。');
    setStatus('接続中…');
    localStorage.setItem(FAMILY_KEY, code);

    fb.docRef = doc(fb.db,'families', code,'lists','default');

    getDoc(fb.docRef).then(async (snap)=>{
      if(snap.exists()){
        fb.applying=true;
        const remote=sanitize(snap.data().items||[]);
        items = mergeItems(remote, items);
        save();
        fb.applying=false;
        render();
      }else{
        await setDoc(fb.docRef,{items, updatedAt: Date.now()});
      }
      if(fb.unsub) fb.unsub();
      fb.unsub = onSnapshot(fb.docRef, s=>{
        if(!s.exists()) return;
        const remote=sanitize(s.data().items||[]);
        fb.applying=true; items = mergeItems(remote, items); save(); fb.applying=false; render();
      }, e=>showError('onSnapshot失敗', e));

      fb.connected=true; setStatus('同期中','ok');
    }).catch(e=>showError('getDoc失敗', e));
  }

  /* ===== CSV/印刷ユーティリティ ===== */
  function sortForOutput(arr){
    return [...arr].sort((a,b)=>{
      const ra=(REGION_ORDER.indexOf(a.region)+1)||999;
      const rb=(REGION_ORDER.indexOf(b.region)+1)||999;
      if(ra!==rb) return ra-rb;
      const pa=prefRank(a.pref), pb=prefRank(b.pref);
      if(pa!==pb) return pa-pb;
      return (a.name||'').localeCompare(b.name||'','ja');
    });
  }
  function csvCell(v){ const s=(v??'').toString().replace(/"/g,'""'); return /[,"\n]/.test(s)?'"'+s+'"':s; }
  function toCSV(data){
    const header=['地域','都道府県','名称','所持','所持日'];
    const rows=data.map(x=>[x.region,x.pref,x.name,x.owned?1:0,x.ownedAt||''].map(csvCell).join(','));
    return ['\ufeff'+header.join(','),...rows].join('\n');
  }
  function downloadBlob(filename, text, mime='text/csv;charset=utf-8;'){
    const blob=new Blob([text],{type:mime});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a'); a.href=url; a.download=filename;
    document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
  }
  function exportCSV(data, filename='chiikawa_all.csv'){
    const sorted=sortForOutput(data);
    const csv=toCSV(sorted);
    downloadBlob(filename, csv);
  }

  /* ===== ダッシュボード ===== */

  // 集計。items から必要な数字を一度に出す
  function dashAggregate(list){
    const total = list.length;
    const ownedItems = list.filter(x => x.owned);
    const owned = ownedItems.length;

    // 地域別
    const regions = [...new Set(list.map(it => migrateRegion(it.region)))]
      .sort((a,b) => (REGION_ORDER.indexOf(a)+1||999) - (REGION_ORDER.indexOf(b)+1||999) || a.localeCompare(b,'ja'))
      .map(r => {
        const rows = list.filter(it => migrateRegion(it.region) === r);
        return { name:r, total:rows.length, owned:rows.filter(x=>x.owned).length };
      });

    // エリア（都道府県相当）別。地域ごとにまとめる
    const areasByRegion = regions.map(r => {
      const rows = list.filter(it => migrateRegion(it.region) === r.name);
      const byPref = new Map();
      for(const it of rows){
        if(!byPref.has(it.pref)) byPref.set(it.pref, []);
        byPref.get(it.pref).push(it);
      }
      const areas = [...byPref].map(([pref, rs]) => ({
        pref: pref || '(未設定)',
        total: rs.length,
        owned: rs.filter(x=>x.owned).length,
        missing: rs.filter(x=>!x.owned).map(x=>x.name)
      })).sort((a,b) => (prefRank(a.pref)-prefRank(b.pref)) || a.pref.localeCompare(b.pref,'ja'));
      return { region:r.name, areas };
    });

    const allAreas = areasByRegion.flatMap(g => g.areas.map(a => ({...a, region:g.region})));
    const completeAreas = allAreas.filter(a => a.total > 0 && a.owned === a.total);

    // あと少しでコンプリートのエリア（残り1〜2件）。多いほど手前に出す
    const nearly = allAreas
      .filter(a => a.owned > 0 && a.owned < a.total && (a.total - a.owned) <= 2)
      .sort((a,b) => (a.total-a.owned) - (b.total-b.owned) || b.owned - a.owned);

    // 獲得の推移（ownedAt を月単位で累積）
    const dated = ownedItems.filter(x => /^\d{4}-\d{2}-\d{2}$/.test(x.ownedAt || ''));
    const undatedOwned = owned - dated.length;
    const byMonth = new Map();
    for(const x of dated){
      const m = x.ownedAt.slice(0,7);
      byMonth.set(m, (byMonth.get(m)||0) + 1);
    }
    const months = [...byMonth.keys()].sort();
    let running = 0;
    const timeline = months.map(m => ({ month:m, added:byMonth.get(m), cum:(running += byMonth.get(m)) }));

    // 直近30日の獲得数
    const cutoff = new Date(Date.now() - 30*86400000).toISOString().slice(0,10);
    const last30 = dated.filter(x => x.ownedAt >= cutoff).length;

    return { total, owned, regions, areasByRegion, allAreas, completeAreas, nearly, timeline, undatedOwned, last30 };
  }

  // 達成率 → 順序ランプの段。0件だけは背景に沈む段を使い、必ず数値を併記する
  function seqStep(owned, total){
    if(total === 0 || owned === 0) return 0;
    const r = owned / total;
    if(r >= 1) return 4;
    if(r >= 2/3) return 3;
    if(r >= 1/3) return 2;
    return 1;
  }
  // 段ごとの文字色。明るい段の上では濃いインクにしてコントラストを確保する
  // 段ごとの背景と文字色。文字色は各段に対して 4.5:1 以上を確保した組み合わせ
  // （#f6f2ec 15.3 / #f48ebd 7.7 / #e85d9d 5.3 は濃いインク、#c93b7c 4.8 / #9c1f5b 7.6 は白）
  const SEQ_BG  = ['var(--seq-0)','var(--pink-1)','var(--pink-2)','var(--pink-3)','var(--pink-4)'];
  const SEQ_INK = ['var(--ink)','var(--ink)','var(--ink)','#ffffff','#ffffff'];

  function pct(n, d){ return d ? Math.round(n/d*100) : 0; }
  const esc2 = (s) => String(s ?? '')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');

  // 累積の推移グラフ。単一系列なので凡例は置かず、終点だけ直接ラベルする
  function renderTimeline(timeline, totalCount){
    if(timeline.length < 2){
      return `<div class="dempty">推移を描くにはデータが足りません。<br>
        所持日が記録された月が2つ以上になると、ここに累積グラフが出ます。</div>`;
    }
    const W = 760, H = 220, mL = 44, mR = 56, mT = 14, mB = 28;
    const pw = W - mL - mR, ph = H - mT - mB;

    // Y軸は 0 起点でキリのいい上限に丸める
    const maxCum = timeline[timeline.length-1].cum;
    const step = maxCum <= 10 ? 2 : maxCum <= 30 ? 5 : maxCum <= 80 ? 10 : 25;
    const yMax = Math.max(step, Math.ceil(maxCum/step)*step);
    const X = i => mL + (timeline.length === 1 ? pw/2 : pw * i/(timeline.length-1));
    const Y = v => mT + ph - ph * (v/yMax);

    const ticks = [];
    for(let v=0; v<=yMax; v+=step) ticks.push(v);

    const grid = ticks.map(v =>
      `<line x1="${mL}" y1="${Y(v).toFixed(1)}" x2="${mL+pw}" y2="${Y(v).toFixed(1)}" stroke="var(--line)" stroke-width="1"/>
       <text x="${mL-8}" y="${(Y(v)+4).toFixed(1)}" text-anchor="end" font-size="11" fill="var(--ink-3)" style="font-variant-numeric:tabular-nums">${v}</text>`
    ).join('');

    const pts = timeline.map((d,i) => `${X(i).toFixed(1)},${Y(d.cum).toFixed(1)}`);
    const area = `M${mL},${(mT+ph).toFixed(1)} L${pts.join(' L')} L${X(timeline.length-1).toFixed(1)},${(mT+ph).toFixed(1)} Z`;

    // X軸ラベルは最大6個。両端は必ず出し、末尾と近すぎる中間ラベルは落として重なりを防ぐ
    const last_i = timeline.length - 1;
    const everyI = Math.max(1, Math.round(last_i / 5));
    const labelIdx = new Set([0, last_i]);
    for(let i = everyI; i < last_i; i += everyI){
      if(last_i - i >= Math.max(1, Math.ceil(everyI/2))) labelIdx.add(i);
    }
    const xlabs = [...labelIdx].sort((a,b)=>a-b).map(i =>
      `<text x="${X(i).toFixed(1)}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--ink-3)">${timeline[i].month.replace('-','/')}</text>`
    ).join('');

    // ホバー用の当たり判定（マークより広く取る）
    const hit = timeline.map((d,i) => {
      const bw = pw / timeline.length;
      return `<rect class="dhit" data-i="${i}" x="${(X(i)-bw/2).toFixed(1)}" y="${mT}" width="${bw.toFixed(1)}" height="${ph}" fill="transparent"/>`;
    }).join('');

    const last = timeline[timeline.length-1];
    return `
      <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="所持数の累積推移">
        ${grid}
        <path d="${area}" fill="var(--pink-2)" fill-opacity="0.10"/>
        <polyline points="${pts.join(' ')}" fill="none" stroke="var(--pink-2)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
        <line class="dcross" x1="0" y1="${mT}" x2="0" y2="${mT+ph}" stroke="var(--line-2)" stroke-width="1" opacity="0"/>
        <circle class="dfocus" r="5" fill="var(--pink-2)" stroke="var(--surface)" stroke-width="2" opacity="0"/>
        <circle cx="${X(timeline.length-1).toFixed(1)}" cy="${Y(last.cum).toFixed(1)}" r="5" fill="var(--pink-2)" stroke="var(--surface)" stroke-width="2"/>
        <text x="${(X(timeline.length-1)+10).toFixed(1)}" y="${(Y(last.cum)+4).toFixed(1)}" font-size="12" fill="var(--ink)" style="font-variant-numeric:tabular-nums">${last.cum}個</text>
        ${xlabs}
        <line x1="${mL}" y1="${mT+ph}" x2="${mL+pw}" y2="${mT+ph}" stroke="var(--line-2)" stroke-width="1"/>
        ${hit}
      </svg>`;
  }

      : `<tr><td colspan="3" style="color:var(--ink-3)">残り2個以内のエリアはありません。</td></tr>`;

    const tableRows = a.allAreas.map(ar => `<tr>
        <td>${esc2(ar.region)}</td><td>${esc2(ar.pref)}</td>
        <td class="n">${ar.owned}</td><td class="n">${ar.total}</td><td class="n">${pct(ar.owned,ar.total)}%</td>
      </tr>`).join('');

    const undatedNote = a.undatedOwned
      ? `<div class="note" style="margin-top:8px;color:var(--ink-3);font-size:12px">
           所持日が未記録の${a.undatedOwned}個はグラフに含まれていません（合計には入っています）。</div>`
      : '';

    return `
      <div class="dwrap">

          </div>
          <div class="dmeter"><i style="width:${rate}%"></i></div>
        </div>

        <div class="dgrid k4">${tiles}</div>

        <div class="dcard">
          <h3>地域別の達成状況</h3>
          ${regionRows}
        </div>

        <div class="dcard">

          ${heat}

        <div class="dcard">

          <div class="dchart">${renderTimeline(a.timeline, a.total)}<div class="dtip"></div></div>
          ${undatedNote}
        </div>

        <div class="dcard">
          <h3>あと少しでコンプリート</h3>
          <div class="dscroll">
            <table class="dtable">
              <thead><tr><th>エリア</th><th class="n">所持</th><th>足りない商品</th></tr></thead>

      ev.currentTarget.textContent = tv.classList.contains('hide') ? '表で見る' : '表を隠す';
      if(!tv.classList.contains('hide')) tv.scrollIntoView({behavior:'smooth', block:'start'});
    };

    // 推移グラフのホバー（クロスヘア＋ツールチップ）。値は表ビューでも読めるので補助扱い
    const chart = el.querySelector('.dchart');
    const svg = chart && chart.querySelector('svg');
    if(svg){
      const a = dashAggregate(items);
      const tip = chart.querySelector('.dtip');
      const cross = svg.querySelector('.dcross');
      const focus = svg.querySelector('.dfocus');
      const hits = [...svg.querySelectorAll('.dhit')];
      const pts = [...svg.querySelectorAll('polyline')][0].getAttribute('points').split(' ').map(s=>s.split(',').map(Number));

      const show = (i) => {
        const [cx, cy] = pts[i];
        const d = a.timeline[i];
        cross.setAttribute('x1', cx); cross.setAttribute('x2', cx); cross.setAttribute('opacity','1');
        focus.setAttribute('cx', cx); focus.setAttribute('cy', cy); focus.setAttribute('opacity','1');
        const sx = svg.getBoundingClientRect().width / svg.viewBox.baseVal.width;
        tip.innerHTML = `<b>${d.month.replace('-','年')}月</b><br>累積 ${d.cum}個（+${d.added}）`;
        tip.style.opacity = '1';
        // 横スクロールする器なので、可視領域ではなく SVG 座標系の中で収める
        const tw = tip.offsetWidth;
        const maxLeft = svg.getBoundingClientRect().width - tw;
        tip.style.left = Math.max(0, Math.min(maxLeft, cx*sx - tw/2)) + 'px';
        tip.style.top = Math.max(0, cy*sx - tip.offsetHeight - 12) + 'px';
      };
      // 隠すときは位置も戻す。出しっぱなしの座標が器の幅を広げてしまうため
      const hide = () => {
        tip.style.opacity='0'; tip.style.left='0px'; tip.style.top='0px';
        cross.setAttribute('opacity','0'); focus.setAttribute('opacity','0');
      };
      hits.forEach(h => {
        const i = Number(h.dataset.i);
        h.addEventListener('mouseenter', () => show(i));
        h.addEventListener('focus', () => show(i));
        h.setAttribute('tabindex','0');
      });
      svg.addEventListener('mouseleave', hide);
      svg.addEventListener('blur', hide, true);
    }
  }

  /* ===== 旅行モード =====
     現地でお土産コーナーに立ったときに使う画面。土地を選ぶと、その土地の
     未所持だけを大きく出す。集めたら押すだけで、一覧に戻らなくても済む。 */
  const TRAVEL_KEY = LS_KEY + '__place';

  function travelPlaces(){
    const m = new Map();
    for(const it of items){
      const p = it.pref || '(未設定)';
      if(!m.has(p)) m.set(p, { pref:p, region:migrateRegion(it.region), total:0, owned:0 });
      const e = m.get(p);
      e.total++; if(it.owned) e.owned++;
    }
    return [...m.values()].sort((a,b) =>
      (regionRankT(a.region) - regionRankT(b.region)) ||
      (prefRank(a.pref) - prefRank(b.pref)) ||
      a.pref.localeCompare(b.pref,'ja'));
  }
  const regionRankT = (r) => { const i = REGION_ORDER.indexOf(r); return i >= 0 ? i : 999; };

  function travelFlash(msg){
    let f = document.querySelector('.tflash');
    if(!f){ f = document.createElement('div'); f.className = 'tflash'; document.body.appendChild(f); }
    f.textContent = msg;
    f.classList.add('show');
    clearTimeout(f._t);
    f._t = setTimeout(() => f.classList.remove('show'), 1700);
  }

  function renderTravel(place){
    const el = document.getElementById('travel');
    const places = travelPlaces();

    // 土地が未選択なら選ぶ画面
    if(!place){
      const groups = new Map();
      for(const p of places){
        if(!groups.has(p.region)) groups.set(p.region, []);
        groups.get(p.region).push(p);
      }
      el.innerHTML = `
        <div class="twrap">
          <div class="thead">
            <h2><small>旅行モード</small>今どこにいますか？</h2>
            <button class="btn ghost sm" data-act="close">閉じる</button>
          </div>
          ${[...groups].map(([r, ps]) => `
            <div class="tsection">${esc2(r)}</div>
            <div class="tpicks">
              ${ps.map(p => {
                const rest = p.total - p.owned;
                const done = rest === 0;
                return `<button class="tpick${done?' clear':''}" data-place="${esc2(p.pref)}">
                  <div class="pn">${esc2(p.pref)}</div>
                  <div class="pc${done?' done':''}">${done ? '制覇済み' : `あと${rest}個`}</div>
                </button>`;
              }).join('')}
            </div>`).join('')}
        </div>`;
      return;
    }

    // 選択済み：その土地の未所持だけを出す
    const all = items.filter(it => (it.pref || '(未設定)') === place);
    const todo = all.filter(it => !it.owned)
      .sort((a,b) => (a.name||'').localeCompare(b.name||'','ja'));
    const owned = all.length - todo.length;

    el.innerHTML = `
      <div class="twrap">
        <div class="thead">
          <h2><small>旅行モード</small>${esc2(place)}</h2>
          <button class="btn ghost sm" data-act="back">土地を変える</button>
          <button class="btn ghost sm" data-act="close">閉じる</button>
        </div>
        <div class="phero" style="padding-bottom:16px">
          <div class="nums"><b>${owned}</b><span> / ${all.length}</span></div>
          <div class="bar"><i style="width:${pct(owned, all.length)}%"></i></div>
          <div class="pct">${pct(owned, all.length)}%</div>
        </div>
        ${todo.length ? `
          <div class="tsection">まだ持っていない ${todo.length}個</div>
          <div class="tlist">
            ${todo.map(it => {
              const f = IMG[normalizedKey(it.region, it.pref, it.name)];
              return `<div class="tcard" data-key="${esc2(normalizedKey(it.region, it.pref, it.name))}">
                <div class="thumb">${f
                  ? `<img src="images/items/${esc2(f)}" alt="" loading="lazy" decoding="async">`
                  : esc2(iconFor(it))}</div>
                <div class="nm">${esc2(it.name)}</div>
                <button class="got" data-act="got">見つけた！</button>
              </div>`;
            }).join('')}
          </div>`
        : `<div class="tdone">
             <div class="big">${esc2(place)} 制覇！</div>
             <div class="sub">${all.length}個ぜんぶ集まっています。</div>
           </div>`}
      </div>`;
  }

  function openTravel(){
    let el = document.getElementById('travel');
    if(!el){
      el = document.createElement('div');
      el.id = 'travel';
      document.body.appendChild(el);

      // 中身は作り直すので、クリックは親で受ける
      el.addEventListener('click', (ev) => {
        const t = ev.target.closest('[data-act], [data-place]');
        if(!t) return;
        if(t.dataset.place){
          localStorage.setItem(TRAVEL_KEY, t.dataset.place);
          renderTravel(t.dataset.place);
          el.scrollTop = 0;
          return;
        }
        const act = t.dataset.act;
        if(act === 'close'){ closeTravel(); return; }
        if(act === 'back'){
          localStorage.removeItem(TRAVEL_KEY);
          renderTravel(null);
          el.scrollTop = 0;
          return;
        }
        if(act === 'got'){
          const card = t.closest('.tcard');
          const key = card.dataset.key;
          const it = items.find(x => normalizedKey(x.region, x.pref, x.name) === key);
          if(!it) return;
          it.owned = true;
          it.ownedAt = it.ownedAt || today();
          persist();
          travelFlash(`${it.name} を追加しました`);
          renderTravel(localStorage.getItem(TRAVEL_KEY));
          render();       // 裏の一覧も合わせて更新
        }
      });
    }
    renderTravel(localStorage.getItem(TRAVEL_KEY));
    el.style.display = 'block';
    el.scrollTop = 0;
    document.body.classList.add('locked');
  }
  function closeTravel(){
    const el = document.getElementById('travel');
    if(el){ el.style.display = 'none'; }
    document.body.classList.remove('locked');
  }
  document.getElementById('btnTravel').addEventListener('click', openTravel);

  // 該当行までスクロールして、その地域を開いた上で一瞬光らせる
  function jumpToItem(key){
    // 絞り込みで隠れている可能性があるので、まず「すべて」に戻して検索も解除する
    let el = app.querySelector(`.tile[data-key="${CSS.escape(key)}"]`);
    if(!el){
      view.q = ''; view.filter = 'all';
      document.getElementById('q').value = '';
      document.getElementById('qClear').classList.add('hide');
      syncFilterButtons();
      render();
      el = app.querySelector(`.tile[data-key="${CSS.escape(key)}"]`);
    }
    if(!el) return;
    el.scrollIntoView({ behavior:'smooth', block:'center' });
    el.style.transition = 'box-shadow .25s, outline-color .25s';
    el.style.outline = '3px solid var(--pink-2)';
    el.style.outlineOffset = '2px';
    setTimeout(() => { el.style.outline = ''; el.style.outlineOffset = ''; }, 1800);
  }

    filterSeg.querySelectorAll('button').forEach(b =>

  let qTimer = null;
  qInput.addEventListener('input', () => {
    qClear.classList.toggle('hide', !qInput.value);
    // 入力ごとに149件を組み直すと重いので少し待つ
    clearTimeout(qTimer);
    qTimer = setTimeout(() => {
      view.q = qInput.value.trim().toLowerCase();
      render();
    }, 140);

    render(); qInput.focus();
  });
  filterSeg.addEventListener('click', (ev) => {

  function renderNews(){
    const bar = document.getElementById('newsBar');
    bar.innerHTML = '';

    // 新着が無いときも枠は出す。何も起きていないことが分かるようにするため
    if(!newArrivals.length){

        </div>`;
      bar.appendChild(quiet);
      return;
    }

    const SHOW = 8;
    const shown = newArrivals.slice(0, SHOW);

    box.className = 'news';
    box.innerHTML = `

      renderNews();

  }

  const ICON_BY_REGION = {
    '北海道地方':'❄️','東北地方':'🌾','関東地方':'🏙️','中部地方':'⛰️','近畿地方':'⛩️',
    '中国地方':'🌊','四国地方':'🍊','九州地方':'🌺','海外':'🌏','その他':'🎫','未分類':'❓',
  };
  const iconFor = (it) => ICON[it.name] || ICON_BY_REGION[migrateRegion(it.region)] || '🧸';

  // 1枚のタイルを組み立てる。クリックで所持を切り替え、日付部分だけは別扱い。
  function buildTile(it){
    const tile = document.createElement('button');
    tile.type = 'button';
    tile.className = 'tile' + (it.owned ? ' owned' : '');
    tile.dataset.key = normalizedKey(it.region, it.pref, it.name);
    tile.setAttribute('aria-pressed', String(!!it.owned));
    tile.title = `${it.pref} ${it.name}`;

    const thumb = document.createElement('span');
    thumb.className = 'thumb';
    const file = IMG[normalizedKey(it.region, it.pref, it.name)];
    if(file){
      const img = document.createElement('img');
      img.src = 'images/items/' + file;
      img.alt = '';
      img.loading = 'lazy';
      img.decoding = 'async';
      // 画像が欠けていたらアイコンに戻す
      img.addEventListener('error', () => { thumb.textContent = iconFor(it); }, { once:true });
      thumb.appendChild(img);
    }else{
      thumb.textContent = iconFor(it);
    }

    const pf = document.createElement('span');
    pf.className = 'tpref';
    pf.textContent = it.pref || '';

    const nm = document.createElement('span');
    nm.className = 'tname';
    nm.textContent = it.name;

    const dt = document.createElement('span');
    dt.className = 'tdate';

    // 日付部分：所持済みなら押して編集できる
    const paintDate = () => {
      dt.textContent = it.owned ? (shortDate(it.ownedAt) || '日付なし') : '';
    };
    paintDate();

    dt.addEventListener('click', (ev) => {
      ev.stopPropagation();
      if(!it.owned) return;
      if(dt.querySelector('input')) return;

      const inp = document.createElement('input');
      inp.type = 'date';
      inp.className = 'dateedit';
      inp.value = it.ownedAt || today();
      inp.max = today();
      dt.textContent = '';
      dt.appendChild(inp);
      inp.focus();
      if(inp.showPicker) { try{ inp.showPicker(); }catch{} }

      const commit = () => {
        if(inp.value) it.ownedAt = inp.value;
        paintDate();
        persist();
      };
      inp.addEventListener('click', e => e.stopPropagation());
      inp.addEventListener('change', commit);
      inp.addEventListener('blur', commit);
      inp.addEventListener('keydown', e => {
        if(e.key === 'Enter'){ e.preventDefault(); inp.blur(); }
        if(e.key === 'Escape'){ e.preventDefault(); paintDate(); }
      });
    });

    const chk = document.createElement('span');
    chk.className = 'chk';
    chk.textContent = '✓';
    chk.setAttribute('aria-hidden', 'true');

    tile.addEventListener('click', () => {
      it.owned = !it.owned;
      it.ownedAt = it.owned ? (it.ownedAt || today()) : null;
      tile.classList.toggle('owned', it.owned);
      tile.setAttribute('aria-pressed', String(it.owned));
      paintDate();
      updateStats();
      repaintRegionBars();
      persist();
      // 絞り込み中は、条件から外れたタイルを引っ込める
      if(!matchesView(it)) render();
    });

    tile.append(thumb, pf, nm, dt, chk);
    return tile;
  }

  function persist(){
    try { save(); }
    catch(e){ console.error('save() failed', e); setStatus('保存に失敗（コンソール参照）','warn'); }
  }

  // 地域ヘッダの進捗だけを描き直す（全体を作り直さずに済ませる）
  function repaintRegionBars(){
    app.querySelectorAll('.region').forEach(sec => {
      const r = sec.dataset.region;
      const all = items.filter(x => migrateRegion(x.region) === r);
      const own = all.filter(x => x.owned).length;
      const pc = all.length ? Math.round(own/all.length*100) : 0;
      sec.querySelector('.rhead .bar > i').style.width = pc + '%';
      const cnt = sec.querySelector('.rhead .cnt');
      cnt.textContent = `${own}/${all.length}`;
      cnt.classList.toggle('done', all.length > 0 && own === all.length);
    });
  }

  function render(){
    app.innerHTML = '';

    const shown = items.filter(matchesView);

    if(!shown.length){
      const e = document.createElement('div');
      e.className = 'emptystate';
      e.textContent = view.q
        ? `「${view.q}」に一致するキーホルダーはありません。`
        : (view.filter === 'todo' ? 'すべて集まりました！' : 'まだ1つも登録されていません。');
      app.appendChild(e);
      updateStats();
      return;
    }

    const regions = [...new Set(shown.map(it => migrateRegion(it.region)))]
      .sort((a,b) => (REGION_ORDER.indexOf(a)+1||999) - (REGION_ORDER.indexOf(b)+1||999) || a.localeCompare(b,'ja'));

    const frag = document.createDocumentFragment();

    for(const r of regions){
      // 進捗バーは絞り込みに関係なく、その地域の全体に対する達成率を出す
      const allR = items.filter(it => migrateRegion(it.region) === r);
      const ownR = allR.filter(x => x.owned).length;
      const pc = allR.length ? Math.round(ownR/allR.length*100) : 0;

      const sec = document.createElement('section');
      sec.className = 'region';
      sec.dataset.region = r;
      sec.innerHTML = `
        <div class="rhead">
          <h2>${esc2(r)}</h2>
          <div class="bar"><i style="width:${pc}%"></i></div>
          <span class="cnt${ownR === allR.length ? ' done' : ''}">${ownR}/${allR.length}</span>
        </div>`;

      // 地域ごとに1つのグリッド。並びは 都道府県順 → 名称順
      const tiles = document.createElement('div');
      tiles.className = 'tiles';
      shown
        .filter(it => migrateRegion(it.region) === r)
        .sort((a,b) =>
          (prefRank(a.pref) - prefRank(b.pref)) ||
          (a.pref||'').localeCompare(b.pref||'','ja') ||
          (a.name||'').localeCompare(b.name||'','ja'))
        .forEach(it => tiles.appendChild(buildTile(it)));
      sec.appendChild(tiles);
      frag.appendChild(sec);
    }

    app.appendChild(frag);
    updateStats();
  }

  // 初期描画（家族コード復元）
  const savedFamily = localStorage.getItem(FAMILY_KEY)||'';
  if(savedFamily) familyCodeInput.value = savedFamily;
  render();
  renderNews();
